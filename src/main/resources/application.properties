spring.application.name=gestionmovil-api
#IMPORTANTE
# Comenta o elimina la siguiente línea cuando quieras usar MySQL
spring.profiles.active=dev

# Configuración de MySQL (ajusta host, puerto, nombre de BD y credenciales según tu entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/gestionmovil_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
